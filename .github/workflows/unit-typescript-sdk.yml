name: unit

on:
  push:
    branches: [main]
    paths:
      - "sdks/typescript/**"
      - "typescript-sdk/**"
      - "integrations/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "nx.json"
      - ".github/workflows/unit-typescript-sdk.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdks/typescript/**"
      - "typescript-sdk/**"
      - "integrations/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "nx.json"
      - ".github/workflows/unit-typescript-sdk.yml"

jobs:
  typescript:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Build
        run: pnpm run build

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            sdks/typescript/packages/*/test-results/junit.xml
            sdks/typescript/packages/*/test-results/results.json
            integrations/**/test-results/junit.xml
            integrations/**/test-results/results.json
            middlewares/**/test-results/junit.xml
            middlewares/**/test-results/results.json
          retention-days: 90

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-reports
          path: |
            sdks/typescript/packages/*/coverage/
            integrations/**/coverage/
            middlewares/**/coverage/
          retention-days: 30
